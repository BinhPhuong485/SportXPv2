<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/brand/symbol.png" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#176344" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SportXP" />
    <title>SportXP — Mỗi Set Cầu • Một Bước Tiến</title>
    <script>
      (function() {
        try {
          var urlMatch = window.location.href.match(/[?&]theme=(light|dark)/);
          var theme = urlMatch ? urlMatch[1] : localStorage.getItem('sportxp-theme');
          if (!theme || (theme !== 'dark' && theme !== 'light')) {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#07080A' : '#176344');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body class="bg-app-background text-app-text antialiased min-h-screen selection:bg-app-primary selection:text-app-on-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
