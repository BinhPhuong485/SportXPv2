<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  
  <defs>
    <!-- Deep Emerald Background Gradient -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6D4C" />
      <stop offset="42%" stop-color="#134E3F" />
      <stop offset="100%" stop-color="#09281E" />
    </linearGradient>

    <!-- Light Theme Gradient -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F7F3" />
    </linearGradient>

    <!-- Streak Gold Gradient (Shuttlecock cork / Victory Star / Gold Tier) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- White-to-Mint Gradient for X (Dark Theme) -->
    <linearGradient id="xGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F7EE" />
    </linearGradient>

    <!-- Mint Gradient for P (Dark Theme) -->
    <linearGradient id="pGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F7EE" />
      <stop offset="100%" stop-color="#C2E8CE" />
    </linearGradient>

    <!-- Green Gradients for Light Theme -->
    <linearGradient id="xGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#134E3F" />
      <stop offset="100%" stop-color="#176344" />
    </linearGradient>

    <linearGradient id="pGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238659" />
      <stop offset="100%" stop-color="#299A63" />
    </linearGradient>

    <!-- Ambient Glow behind symbol -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#299A63" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#134E3F" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#09281E" stop-opacity="0" />
    </radialGradient>

    <!-- Professional Elevation Drop Shadows -->
    <filter id="markElevationDark" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <filter id="markElevationLight" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#134E3F" flood-opacity="0.16" />
    </filter>
  </defs>
    
  
  <!-- MASTER MARK: OPTICALLY CENTERED XP MONOGRAM + DYNAMIC SHUTTLECOCK -->
  <g filter="url(#markElevationLight)" transform="translate(-24, 6)">
    
    <!-- ============================================== -->
    <!-- 1. LETTER 'X' (Left Side Athletic Monogram) -->
    <!-- ============================================== -->
    <!-- Downward Slash (Top-Left to Bottom-Right) -->
    <path d="M 116 206 L 168 206 L 226 280 L 192 306 Z" fill="url(#xGradLight)" />
    <path d="M 244 326 L 274 306 L 322 388 L 270 388 Z" fill="url(#xGradLight)" />

    <!-- Upward Slash (Bottom-Left to Top-Right launching the shuttlecock) -->
    <path d="M 124 388 L 176 388 L 282 230 L 240 206 Z" fill="url(#xGradLight)" />

    <!-- ============================================== -->
    <!-- 2. SHUTTLECOCK APEX (Extending from Top-Right of X) -->
    <!-- ============================================== -->
    <g transform="translate(280, 218) rotate(45)">
      <!-- Golden Cork Dome (The Sweet Spot & Gold Rank) -->
      <path d="M -19 0 C -19 -19 19 -19 19 0 L 19 10 L -19 10 Z" fill="url(#goldGrad)" />
      <!-- Dark rim collar band -->
      <rect x="-19" y="7" width="38" height="4" fill="#78350F" opacity="0.55" />
      <!-- Highlight spot -->
      <circle cx="0" cy="-5" r="5" fill="#FEF3C7" opacity="0.9" />

      <!-- Aerodynamic Feather Plume -->
      <path d="M -18 -4 L -40 -62 L -20 -54 L -10 -4 Z" fill="#A3E5B8" opacity="0.95" />
      <path d="M -9 -6 L -9 -84 L 9 -84 L 9 -6 Z" fill="#134E3F" />
      <path d="M 10 -4 L 20 -54 L 40 -62 L 18 -4 Z" fill="#A3E5B8" opacity="0.95" />
      
      <!-- Feather Thread Ring (Chỉ đan nan cầu) -->
      <path d="M -18 -28 Q 0 -24 18 -28" stroke="#09281E" stroke-width="2.6" fill="none" opacity="0.8" />
      <path d="M -24 -46 Q 0 -42 24 -46" stroke="#09281E" stroke-width="2.2" fill="none" opacity="0.6" />
    </g>

    <!-- ============================================== -->
    <!-- 3. LETTER 'P' (Right Side Athletic Monogram) -->
    <!-- ============================================== -->
    <g fill="url(#pGradLight)">
      <!-- Vertical Stem with balanced 14px negative space channel -->
      <path d="M 338 206 L 384 206 L 384 388 L 338 388 Z" />
      
      <!-- P Geometric Outer Arch & Inner Bowl -->
      <path fill-rule="evenodd" d="M 378 206 L 434 206 C 474 206 496 228 496 264 C 496 300 474 322 434 322 L 378 322 Z 
                                  M 384 244 L 428 244 C 448 244 458 252 458 264 C 458 276 448 284 428 284 L 384 284 Z" />
    </g>

  </g>
    
</svg>